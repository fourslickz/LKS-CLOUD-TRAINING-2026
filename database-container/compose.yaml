services:
  mariadb:
    build:
      context: ..
      dockerfile: database-container/Dockerfile
    container_name: lks-cloud-training-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-training_root_password}
      MARIADB_DATABASE: db_siswa
      MARIADB_USER: ${MARIADB_USER:-siswa_app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-siswa_app_password}
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping --host=127.0.0.1 --user=root --password="$${MARIADB_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mariadb_data:
